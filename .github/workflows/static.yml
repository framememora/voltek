# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # This deploy is a client preview. index.html in the repo stays production-ready
      # for voltekindustries.co.in; only the deployed copy is adjusted.
      - name: Build preview site
        run: |
          mkdir _site
          cp -r index.html voltek-logo.jpg assets CNAME _site/
          host=$(tr -d '[:space:]' < CNAME)
          sed -i \
            -e 's#<meta name="robots" content="index, follow">#<meta name="robots" content="noindex, nofollow">#' \
            -e "s#https://voltekindustries.co.in/#https://$host/#g" \
            _site/index.html
          # Fail the deploy rather than publish an indexable preview.
          grep -q 'content="noindex, nofollow"' _site/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Site files only, so repo and tool files aren't published
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
